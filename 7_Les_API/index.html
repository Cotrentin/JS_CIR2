<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="./css/normalize.css">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/script.js" defer type="module"></script>
</head>
<body>
  <h1>Pokédex National</h1>
  <h2>Recherche et filtres</h2>
  
  <section id="filtre">
    <div class="filters-container">
        <div class="select">
          <select id="generation-select">
            <option value="1">Génération 1</option>
            <option value="2">Génération 2</option>
            <option value="3">Génération 3</option>
            <option value="4">Génération 4</option>
            <option value="5">Génération 5</option>
            <option value="6">Génération 6</option>
            <option value="7">Génération 7</option>
            <option value="8">Génération 8</option>
          </select>
        </div>

        <div class="select">
          <select id="sort-select">
            <option value="id">Tri : Numéro</option>
            <option value="name">Tri : Nom</option>
            <option value="hp">Tri : Points de vie</option>
            <option value="attack">Tri : Attaque</option>
            <option value="type">Tri : Type</option>
          </select>
        </div>

        <div class="shiny-container">
            <input type="checkbox" id="shiny-toggle">
            <label for="shiny-toggle">Version Shiny</label>
        </div>
    </div>
  </section>

  <div id="types"></div>

  <main id="pokemon-container"></main>

</body>
</html>
